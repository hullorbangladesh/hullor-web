<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Hullor — Hullor</title>
<link rel="shortcut icon" type="image/x-icon" href="assets/images/favicon.svg" />

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --cream: #F4F1EB;
    --ink: #1C1F1A;
    --forest-deep: #1A3025;
    --gold: #B8963E;
    --sand: #D8CFA8;
    --white: #FFFFFF;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background-color: var(--cream);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* Main */
  main {
    flex: 1;
    max-width: 900px;
    margin: 80px auto;
    padding: 0 15px;
    text-align: center;
  }

  .contact-card {
    background: var(--white);
    border-top: 4px solid var(--gold);
    padding: 50px 40px;
    box-shadow: 0 20px 40px rgba(26, 48, 37, 0.05);
    margin-top: 40px;
  }

  h2 {
    font-family: 'Playfair Display', serif;
    color: var(--forest-deep);
    margin-bottom: 15px;
    font-size: 2.2em;
    font-weight: 900;
  }

  p {
    font-size: 1.1em;
    line-height: 1.8;
    margin-bottom: 18px;
    font-weight: 300;
  }

  .contact-info {
    font-size: 1.5em;
    color: var(--forest-deep);
    font-weight: 500;
    margin: 10px 0;
  }

  .contact-info a {
    color: var(--forest-deep);
    text-decoration: none;
    transition: 0.3s;
  }

  .contact-info a:hover {
    color: var(--gold);
  }

  .whatsapp-badge {
    display: inline-block;
    background-color: #25D366;
    color: white;
    padding: 5px 15px;
    border-radius: 50px;
    font-size: 0.5em;
    vertical-align: middle;
    margin-left: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Back Button */
  a.back {
    display: inline-block;
    margin-top: 40px;
    background-color: var(--forest-deep);
    color: #E8D49A;
    text-decoration: none;
    padding: 14px 32px;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: 0.3s;
  }

  a.back:hover {
    background-color: var(--ink);
    transform: translateY(-2px);
  }

  /* Footer */
  footer {
    background-color: var(--forest-deep);
    color: rgba(232, 212, 154, 0.7);
    text-align: center;
    padding: 40px 20px;
    font-size: 0.8em;
    letter-spacing: 1px;
    margin-top: auto;
  }

  /* Mobile */
  @media (max-width: 600px) {
    main {
      margin: 40px auto;
    }

    .contact-card {
      padding: 40px 20px;
    }

    h2 {
      font-size: 1.8em;
    }

    .contact-info {
      font-size: 1.2em;
    }
  }
</style>

</head>

<body>

<main>
  <h2>Get in Touch</h2>
  <p>
    Have questions about our elegant accessories or need assistance with an order? 
    Reach out to us directly via call or WhatsApp.
  </p>

  <div class="contact-card">
    <p style="text-transform: uppercase; letter-spacing: 2px; font-size: 0.8em; color: var(--gold); font-weight: 500;">Direct Contact</p>
    <div class="contact-info">
      📞 <a href="tel:01863709122">01863709122</a>
    </div>
    <div class="contact-info">
      💬 <a href="https://wa.me/8801863709122" target="_blank">01863709122</a>
      <span class="whatsapp-badge">WhatsApp</span>
    </div>
    <p style="margin-top: 20px; font-size: 0.9em; color: var(--muted);">Available 10:00 AM — 10:00 PM</p>
  </div>

  <a href="index.html" class="back">← Back to Store</a>
</main>

<footer>
  &copy; 2026 Hullor Bangladesh. All rights reserved.  
</footer>

</body>
</html>
