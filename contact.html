<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Hullor — Hullor</title>
<link rel="shortcut icon" type="image/x-icon" href="assets/images/favicon.svg" />

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    font-family: 'Poppins', sans-serif;
    background-color: #fffaf2;
    color: #333;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* Header */
  header {
    background: linear-gradient(135deg, #A020F0, #A020F0);
    color: white;
    padding: 25px 20px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  header h1 {
    margin: 0;
    font-size: 2.2em;
    font-weight: 700;
  }

  /* Main */
  main {
    flex: 1;
    max-width: 900px;
    margin: 70px auto 0 auto;
    padding: 0 20px;
    text-align: center;
  }

  .contact-card {
    background: white;
    border-radius: 14px;
    padding: 45px 35px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    margin-top: 40px;
  }

  h2 {
    color: #A020F0;
    margin-bottom: 15px;
    font-size: 1.6em;
  }

  p {
    font-size: 1.05em;
    line-height: 1.8;
    margin-bottom: 18px;
  }

  .email {
    font-size: 1.15em;
    color: #A020F0;
    font-weight: 600;
  }

  /* Back Button */
  a.back {
    display: inline-block;
    margin-top: 40px;
    background-color: #A020F0;
    color: white;
    text-decoration: none;
    padding: 12px 26px;
    border-radius: 8px;
    font-weight: 600;
    transition: 0.3s;
  }

  a.back:hover {
    box-shadow: 0 6px 14px rgba(160,32,240,0.3);
  }

  /* Footer */
  footer {
    background-color: #A020F0;
    color: white;
    text-align: center;
    padding: 30px 20px;
    font-size: 0.9em;
    letter-spacing: 0.5px;
  }

  /* Mobile */
  @media (max-width: 600px) {
    header h1 {
      font-size: 1.8em;
    }

    .contact-card {
      padding: 35px 22px;
    }
  }
</style>
</head>

<body>

<main>
  <h2>Get in Touch</h2>
  <p>
    We’re always happy to hear from you! Whether you have questions, suggestions, or
    just want to say hello, reach out anytime.
  </p>

  <div class="contact-card">
    <p>Email our support team at:</p>
    <p class="email">📧 <a href="mailto:eventappbangladesh@gmail.com" style="color:#A020F0;text-decoration:none;">eventappbangladesh@gmail.com</a></p>
  </div>

  <a href="/" class="back">← Back to Home</a>
</main>

<footer>
  &copy; 2025 Hullor Bangladesh. All rights reserved.  
</footer>

</body>
</html>
